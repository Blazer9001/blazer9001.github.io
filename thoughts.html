---
layout: default
title: thoughts index
---

<h2>index of thoughts</h2>

<ul style="text-align:left; display: inline-block;">
  {% if site.posts.size == 0 %}
    <p>nothing here yet</p>
  {% endif %}

  {% for post in site.posts reversed %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
